version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cattlex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cattlex_db
      POSTGRES_USER: cattlex_user
      POSTGRES_PASSWORD: cattlex_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cattlex_user -d cattlex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: cattlex-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./iot/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cattlex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cattlex_user:cattlex_secure_password@postgres:5432/cattlex_db
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      JWT_SECRET: cattlex-super-secret-key-2026-ieee-production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cattlex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
